<!DOCTYPE html>
<html>
    <head>
        <title>Setup ID Converter</title>
        <link rel="stylesheet" href="../../../dark_mode.css">
        <link rel="stylesheet" href="../calculator.css">
        <script src="../GUI_creator.js"></script>
        <script src="converter.js"></script>
    </head>
    <nav>
        <a href="https://herodirk.github.io">Home</a>
        <a href="https://herodirk.github.io/minion/index.html">Minions</a>
        <a href="https://herodirk.github.io/minion/calculator/setup_id_converter/index.html">ID Converter</a>
    </nav>
    <body>
        <h1>Minion Calculator: Setup ID Converter</h1>
        <div class="calculator">
            <div id="inputs" class="frame">
                <div id="inputs_grid" class="input_grid_frame"></div>
            </div><div id="outputs" class="frame">
                <div id="outputs_grid" class="output_grid_frame"></div>
            </div>
            <dialog id="edit_vars_dialog" class="floating_dialog">
                <div id="edit_vars" class="small_frame">
                    <div id="edit_vars_grid" class="edit_grid_frame"></div>
                </div>
                <div id="edit_vars_controls" class="controls_frame" style="position: absolute; bottom: 0;"></div>
            </dialog>
        </div>
        <script>
            const GUI = new GUI_creator();
            const version_ranges_promise = GUI.call_API("https://herodirk.github.io/minion/calculator/version_api/ranges.json", "Herodirk Github Data Version Ranges")
            let conv;
            let MD;
            Promise.all([version_ranges_promise]).then((resolves) => {
                const [version_ranges_json] = resolves;
                conv = new converter({"version_ranges": version_ranges_json}, GUI);
            })
        </script>
    </body>
</html>
